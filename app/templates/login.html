{% extends "base.html" %}
{% block content %}
<div class="login-shell">
  <div class="login-panel">
    <div class="login-brand">
      <span class="login-badge">Secure access</span>
      <h2>Connexion</h2>
    </div>

    <p class="login-subtitle">Entrez vos identifiants pour accéder à l'application.</p>

    <form method="post" class="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">Nom d'utilisateur</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="Entrer votre nom d'utilisateur" required>
      </div>
      <div class="mb-4">
        <label for="password" class="form-label">Mot de passe</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Se connecter</button>
    </form>
  </div>
</div>
{% endblock %}
