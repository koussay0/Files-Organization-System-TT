{% extends "base.html" %}
{% block content %}
<div class="page-header mb-4">
  <div>
    <h2>Sort File</h2>
    <p class="text-muted">Sort rows by a selected column or by full row content.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{{ url_for('single_file.home') }}">Back</a>
</div>

<div class="card card-body shadow-sm mb-4">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Sort by</label>
        <select class="form-select" name="mode">
          <option value="column">Specific column</option>
          <option value="row">Full row</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Column</label>
        <select class="form-select" name="column">
          {% for col in columns %}
            <option value="{{ col }}">{{ col }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <div class="form-check w-100">
          <input class="form-check-input" type="checkbox" name="ascending" checked id="ascendingCheck">
          <label class="form-check-label" for="ascendingCheck">Ascending order</label>
        </div>
      </div>
    </div>
    <div class="mt-4 text-end">
      <button class="btn btn-primary" type="submit">Sort</button>
    </div>
  </form>
</div>

{% if result_html %}
  <div class="d-flex flex-wrap gap-2 mb-3">
    <a class="btn btn-sm btn-success" href="{{ url_for('single_file.export_last_result', fmt='csv') }}">Export CSV</a>
    <a class="btn btn-sm btn-success" href="{{ url_for('single_file.export_last_result', fmt='xlsx') }}">Export Excel</a>
    <a class="btn btn-sm btn-success" href="{{ url_for('single_file.export_last_result', fmt='txt') }}">Export TXT</a>
    <a class="btn btn-sm btn-success" href="{{ url_for('single_file.export_last_result', fmt='pdf') }}">Export PDF</a>
  </div>
  <div class="card card-body shadow-sm">
    <h5 class="mb-3">Result (first 50 rows)</h5>
    <div class="table-responsive">{{ result_html | safe }}</div>
  </div>
{% endif %}
{% endblock %}
