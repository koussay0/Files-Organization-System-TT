{% extends "base.html" %}
{% block content %}
<div class="page-header mb-4">
  <div>
    <h2>Diviser le fichier</h2>
    <p class="text-muted">Divisez votre jeu de données en fichiers plus petits selon le nombre de fichiers ou le nombre de lignes.</p>
  </div>
  <a class="btn btn-outline-secondary" href="{{ url_for('single_file.home') }}">Retour</a>
</div>

<div class="card card-body shadow-sm">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Mode de division</label>
        <select class="form-select" name="split_mode">
          <option value="files">Nombre de fichiers résultats</option>
          <option value="rows">Lignes par fichier</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Nombre de fichiers</label>
        <input class="form-control" type="number" name="n_files" min="1" value="2">
      </div>
      <div class="col-md-4">
        <label class="form-label">Lignes par fichier</label>
        <input class="form-control" type="number" name="rows_per_file" min="1" value="1000">
      </div>
      <div class="col-md-4">
        <label class="form-label">Format d'export</label>
        <select class="form-select" name="fmt">
          <option value="csv">CSV</option>
          <option value="txt">TXT</option>
          <option value="xlsx">Excel</option>
        </select>
      </div>
    </div>
    <div class="mt-4 text-end">
      <button class="btn btn-primary" type="submit">Diviser et télécharger le ZIP</button>
    </div>
  </form>
</div>
{% endblock %}
